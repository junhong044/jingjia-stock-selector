name: 竞价选股（云端）

on:
  schedule:
    # 北京时间 9:26（UTC 1:26），工作日 —— 开盘前推送
    # 说明：改用腾讯批量快照模式(--early)：竞价价=快照「今开」(9:25撮合价)、
    #       竞价额=快照成交额，9:25 撮合完成即写入快照，无需等 9:30 分时首条。
    #       脚本内 fetch_with_retry 会等待重试(约40秒)，覆盖撮合数据写入延迟。
    #       注意：快照成交额在 9:30 后变为当日累计额，故本模式务必在 9:30 前跑。
    - cron: '26 1 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYYMMDD（留空=最近交易日）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  jingjia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run jingjia daily
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TZ: Asia/Shanghai
        run: |
          cd scripts
          # 定时触发走 --early 快照模式(9:26)；手动指定日期时可用普通模式(回测历史)
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python run_daily.py --date "${{ github.event.inputs.date }}"
          else
            python run_daily.py --early
          fi
